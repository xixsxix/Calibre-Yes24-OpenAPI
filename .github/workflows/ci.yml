name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  metadata-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile Metadata Source
        run: python -m py_compile yes24.py yes24_054_patch.py build_plugin.py test_steady_tag_054.py

      - name: Verify Metadata Source 0.5.3 behavior markers
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path('yes24.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          cls = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'Yes24')
          funcs = {n.name: n for n in cls.body if isinstance(n, ast.FunctionDef)}

          identify = ast.get_source_segment(source, funcs['identify'])
          rank = ast.get_source_segment(source, funcs['_rank_and_filter'])
          metrics = ast.get_source_segment(source, funcs['_candidate_metrics'])
          cover = ast.get_source_segment(source, funcs['download_cover'])
          search_queries = ast.get_source_segment(source, funcs['_search_queries'])
          sequence = ast.get_source_segment(source, funcs['_title_sequence_conflict'])
          metadata = ast.get_source_segment(source, funcs['_metadata_from_item'])

          assert 'version = (0, 5, 3)' in source
          assert '"identifier:yes24"' in source
          assert 'mi.set_identifier("yes24", item_id)' in metadata
          assert '(?<=[A-Za-z])' in search_queries and '(?=\\d)' in search_queries
          assert 'query_key == candidate_key' in sequence
          assert 'MAX_IDENTIFY_RESULTS = 10' in source
          assert 'search_items.extend(' in identify
          assert '_top_candidate_is_safe(' not in identify
          assert 'results[:MAX_IDENTIFY_RESULTS]' in identify
          assert '_prefer_ebook_within_same_work(' not in rank
          assert 'score -= min(source_order' not in metrics
          assert 'YES24 selected-candidate cover cache hit' in cover
          assert cover.index('cached = self.get_cached_cover_url') < cover.index('item = None')
          print('YES24 Metadata Source 0.5.3 base behavior contract: OK')
          PY

      - name: Verify Metadata Source 0.5.4 steady tag contract
        run: python test_steady_tag_054.py

      - name: Build Metadata Source ZIP
        run: python build_plugin.py

      - name: Verify Metadata Source ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          path = Path('Yes24.zip')
          assert path.is_file(), 'Yes24.zip was not built'
          with ZipFile(path) as archive:
              names = archive.namelist()
              assert names == ['__init__.py'], names
              source = archive.read('__init__.py').decode('utf-8')
              compile(source, '__init__.py', 'exec')
              assert 'Yes24.version = (0, 5, 4)' in source
              assert '"⭐스테디셀러"' in source
              assert '"identifier:yes24"' in source
              assert 'MAX_IDENTIFY_RESULTS = 10' in source
              assert 'YES24 selected-candidate cover cache hit' in source
          print('Yes24.zip 0.5.4 structure and source compile: OK')
          PY

  library-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile Library Status sources
        working-directory: library_status
        run: |
          python -m py_compile \
            __init__.py ui.py ui_036.py client.py columns.py history.py steady_cache.py \
            build_plugin.py test_status_core.py test_history_core.py \
            test_public_contract.py test_steady_cache.py

      - name: Run Library Status core tests
        working-directory: library_status
        run: |
          python test_status_core.py
          python test_history_core.py
          python test_public_contract.py
          python test_steady_cache.py

      - name: Build Library Status ZIP
        working-directory: library_status
        run: python build_plugin.py

      - name: Verify Library Status ZIP
        working-directory: library_status
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          path = Path('Yes24LibraryStatus.zip')
          assert path.is_file(), 'Yes24LibraryStatus.zip was not built'
          expected = {
              '__init__.py',
              'ui.py',
              'ui_036.py',
              'client.py',
              'columns.py',
              'history.py',
              'steady_cache.py',
              'plugin-import-name-yes24_library_status.txt',
          }
          with ZipFile(path) as archive:
              names = set(archive.namelist())
              assert names == expected, names
              for name in ('__init__.py', 'ui.py', 'ui_036.py', 'client.py', 'columns.py', 'history.py', 'steady_cache.py'):
                  source = archive.read(name).decode('utf-8')
                  compile(source, name, 'exec')
              init = archive.read('__init__.py').decode('utf-8')
              ui = archive.read('ui.py').decode('utf-8')
              ui_036 = archive.read('ui_036.py').decode('utf-8')
              steady = archive.read('steady_cache.py').decode('utf-8')
              assert 'version = (0, 3, 6)' in init
              assert 'yes24_library_status.ui_036:' in init
              assert 'SNAPSHOT_FRESH_TTL_SECONDS = 10 * 60' in ui
              assert 'worker_class = CachedStatusWorker' in ui
              assert 'steady-seller cache worker started' in ui_036
              assert 'STEADYSELLER_URL' in steady
          print('Yes24LibraryStatus.zip 0.3.6 structure and source compile: OK')
          PY
