name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  metadata-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Metadata Source
        run: python -m py_compile yes24.py yes24_054_patch.py yes24_055_patch.py build_plugin.py test_steady_tag_054.py test_category_tags_055.py
      - name: Verify Metadata Source contracts
        run: |
          python test_steady_tag_054.py
          python test_category_tags_055.py
      - name: Build Metadata Source ZIP
        run: python build_plugin.py
      - name: Verify Metadata Source ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          path = Path('Yes24.zip')
          assert path.is_file()
          with ZipFile(path) as archive:
              assert archive.namelist() == ['__init__.py']
              source = archive.read('__init__.py').decode('utf-8')
              compile(source, '__init__.py', 'exec')
              assert 'Yes24.version = (0, 5, 5)' in source
              assert 'YES24 related categories:' in source
              assert '_extract_search_isbn_055' in source
              assert '"⭐스테디셀러"' in source
              assert '"identifier:yes24"' in source
          print('Yes24.zip 0.5.5 structure and source compile: OK')
          PY

  library-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Library Status sources
        working-directory: library_status
        run: |
          python -m py_compile __init__.py ui.py ui_036.py client.py columns.py history.py steady_cache.py build_plugin.py test_status_core.py test_history_core.py test_public_contract.py test_steady_cache.py
      - name: Run Library Status core tests
        working-directory: library_status
        run: |
          python test_status_core.py
          python test_history_core.py
          python test_public_contract.py
          python test_steady_cache.py
      - name: Build Library Status ZIP
        working-directory: library_status
        run: python build_plugin.py
      - name: Verify Library Status ZIP
        working-directory: library_status
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          path = Path('Yes24LibraryStatus.zip')
          assert path.is_file()
          expected = {'__init__.py','ui.py','ui_036.py','client.py','columns.py','history.py','steady_cache.py','images/icon.png','plugin-import-name-yes24_library_status.txt'}
          with ZipFile(path) as archive:
              assert set(archive.namelist()) == expected
              init = archive.read('__init__.py').decode('utf-8')
              assert 'version = (0, 3, 7)' in init
              assert len(archive.read('images/icon.png')) > 1000
          print('Yes24LibraryStatus.zip 0.3.7 structure, icon and source compile: OK')
          PY
