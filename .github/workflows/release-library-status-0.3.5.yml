name: Release Library Status 0.3.5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-library-status-0.3.5.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Library Status source
        working-directory: library_status
        run: |
          python -m py_compile __init__.py ui.py client.py columns.py history.py build_plugin.py test_status_core.py test_history_core.py test_public_contract.py
          python test_status_core.py
          python test_history_core.py
          python test_public_contract.py

      - name: Build Library Status ZIP
        working-directory: library_status
        run: python build_plugin.py

      - name: Verify release ZIP
        working-directory: library_status
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          path = Path('Yes24LibraryStatus.zip')
          assert path.is_file(), 'Yes24LibraryStatus.zip was not built'
          with ZipFile(path) as archive:
              names = set(archive.namelist())
              expected = {
                  '__init__.py', 'ui.py', 'client.py', 'columns.py', 'history.py',
                  'plugin-import-name-yes24_library_status.txt',
              }
              assert names == expected, (names, expected)
              init = archive.read('__init__.py').decode('utf-8')
              ui = archive.read('ui.py').decode('utf-8')
              compile(init, '__init__.py', 'exec')
              compile(ui, 'ui.py', 'exec')
              assert 'version = (0, 3, 5)' in init
              assert 'Yes24LibraryStatusAction' in init
              assert 'SNAPSHOT_FRESH_TTL_SECONDS = 10 * 60' in ui
          print('YES24 Library Status 0.3.5 release ZIP: OK')
          PY
          sha256sum Yes24LibraryStatus.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view library-status-v0.3.5 >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite."
            exit 1
          fi
          gh release create library-status-v0.3.5 \
            library_status/Yes24LibraryStatus.zip \
            --target "$GITHUB_SHA" \
            --title "YES24 Library Status for Calibre 0.3.5" \
            --notes-file docs/releases/library-status-0.3.5.md

      - name: Mark documentation as released
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '> Metadata Source 0.5.3은 공개 안정 릴리스입니다. Library Status 0.3.5는 실사용 검증을 완료했고 공개 소스/CI 패키징 단계에 있습니다. `Yes24LibraryStatus.zip`의 공식 Release 자산은 공개 소스 후보를 Calibre에서 재검증한 뒤 게시합니다.'
          new = '> Metadata Source 0.5.3과 Library Status 0.3.5는 공개 안정 릴리스입니다. GitHub Releases에서 `Yes24.zip`과 `Yes24LibraryStatus.zip`을 각각 설치할 수 있습니다.'
          if old not in text:
              raise SystemExit('README release-state marker not found')
          readme.write_text(text.replace(old, new), encoding='utf-8')

          releases = Path('docs/releases.md')
          text = releases.read_text(encoding='utf-8')
          text = text.replace(
              '| YES24 Library Status | 0.3.5 | 실사용 검증 완료, 공개 패키징 진행 | `Yes24LibraryStatus.zip` |',
              '| YES24 Library Status | 0.3.5 | 공개 안정 릴리스 | `Yes24LibraryStatus.zip` |',
          )
          marker = '- [0.3.5 검증 및 릴리스 기준](./releases/library-status-0.3.5.md)'
          replacement = marker + '\n- [0.3.5 공개 패키지 최종 검증](./releases/library-status-0.3.5-package-validation.md)'
          if marker not in text:
              raise SystemExit('docs/releases.md marker not found')
          releases.write_text(text.replace(marker, replacement), encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/releases.md
          git commit -m "Mark Library Status 0.3.5 as released"
          git push
