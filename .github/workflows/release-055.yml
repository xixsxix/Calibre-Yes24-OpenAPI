name: Release Metadata Source 0.5.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-055.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Metadata Source
        run: python build_plugin.py
      - name: Verify package
        run: |
          python test_steady_tag_054.py
          python test_category_tags_055.py
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('Yes24.zip') as z:
              source = z.read('__init__.py').decode('utf-8')
              compile(source, '__init__.py', 'exec')
              assert 'Yes24.version = (0, 5, 5)' in source
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.5.5 Yes24.zip \
            --target "${GITHUB_SHA}" \
            --title "YES24 Metadata Source for Calibre 0.5.5" \
            --notes-file docs/releases/metadata-source-0.5.5.md
