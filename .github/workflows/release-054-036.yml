name: Release 0.5.4 and 0.3.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-054-036.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Metadata Source 0.5.4
        run: python build_plugin.py

      - name: Build Library Status 0.3.6
        working-directory: library_status
        run: python build_plugin.py

      - name: Create Metadata Source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.4 >/dev/null 2>&1; then
            echo 'v0.5.4 already exists; skipping'
          else
            gh release create v0.5.4 Yes24.zip \
              --title 'YES24 Metadata Source for Calibre 0.5.4' \
              --notes-file RELEASE_NOTES_0.5.4_AND_LIBRARY_STATUS_0.3.6.md \
              --target "$GITHUB_SHA"
          fi

      - name: Create Library Status release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view library-status-v0.3.6 >/dev/null 2>&1; then
            echo 'library-status-v0.3.6 already exists; skipping'
          else
            gh release create library-status-v0.3.6 library_status/Yes24LibraryStatus.zip \
              --title 'YES24 Library Status for Calibre 0.3.6' \
              --notes-file library_status/RELEASE_NOTES_0.3.6.md \
              --target "$GITHUB_SHA"
          fi
