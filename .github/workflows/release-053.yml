# one-shot release trigger
name: Release YES24 0.5.3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-053.yml']
permissions:
  contents: write
jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m py_compile yes24.py build_plugin.py
      - run: python build_plugin.py
      - name: Verify version
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('Yes24.zip') as z:
              s=z.read('__init__.py').decode('utf-8')
              compile(s,'__init__.py','exec')
              assert 'version = (0, 5, 3)' in s
              assert '"identifier:yes24"' in s
          print('0.5.3 release ZIP verified')
          PY
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! "$(git tag -l v0.5.3)"
          git tag v0.5.3
          git push origin v0.5.3
          gh release create v0.5.3 Yes24.zip --title "YES24 Metadata Source for Calibre 0.5.3" --notes-file RELEASE_NOTES_0.5.3.md
