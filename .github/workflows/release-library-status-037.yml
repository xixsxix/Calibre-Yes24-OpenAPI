name: Release Library Status 0.3.7

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-library-status-037.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and build
        working-directory: library_status
        run: |
          python test_status_core.py
          python test_history_core.py
          python test_public_contract.py
          python test_steady_cache.py
          python build_plugin.py
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('Yes24LibraryStatus.zip') as z:
              assert 'images/icon.png' in z.namelist()
              assert len(z.read('images/icon.png')) > 1000
              init = z.read('__init__.py').decode('utf-8')
              assert 'version = (0, 3, 7)' in init
          print('Library Status 0.3.7 release asset: OK')
          PY
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create library-status-v0.3.7 \
            library_status/Yes24LibraryStatus.zip \
            --title "YES24 Library Status for Calibre 0.3.7" \
            --notes-file docs/releases/library-status-0.3.7.md \
            --target "${GITHUB_SHA}"
